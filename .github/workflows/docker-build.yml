name: Build Backend Image

on:
  push:
    branches:
      - main
      - dev

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            almogbcr/weatherapp-backend:${{ env.SHORT_SHA }}
            almogbcr/weatherapp-backend:${{ github.ref_name }}-${{ env.SHORT_SHA }}

      - name: Checkout infrastructure repository
        uses: actions/checkout@v5
        with:
          repository: almogbcr/weatherapp-infra
          ref: main
          token: ${{ secrets.WEATHERAPP_UPDATE }}
          path: infra
     
      - name: install yq
        run: |
          wget -q https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 -O /tmp/yq
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Update Backend Image Tag
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            VALUES_FILE="values-prod.yaml"
          else
            VALUES_FILE="values-dev.yaml"
          fi

          FILE="infra/k8s/helm/weatherapp/$VALUES_FILE"

          yq -i '.backend.image.imgTag = strenv(SHORT_SHA)' "$FILE"

          git -C infra diff -- "k8s/helm/weatherapp/$VALUES_FILE"